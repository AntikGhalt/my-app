[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "istatsync"
version = "2.0.0"
description = "Scarica serie ISTAT (SDMX) e le pubblica come CSV ed Excel versionati"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Paolo Refuto" }]
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
drive = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
]
dev = [
    "istatsync[drive]",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
istatsync = "istatsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
