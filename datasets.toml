# Datasets published by istatsync. See README, "Aggiungere un dataset".
#
# Dimensions left out of `filter` are downloaded in full. Use
# `istatsync describe <dataflow> --codes <DIM>` to see the available codes.

[defaults]
filter = { REF_AREA = "IT" }

# ---------------------------------------------------------------------------
# Trimestrali
# ---------------------------------------------------------------------------

[[dataset]]
id = "famiglie_conto_trimestrale"
title = "Famiglie consumatrici: sequenza dei conti (trimestrale)"
dataflow = "162_1064_DF_DCCN_ISTITUZ_QNA1_1"
frequency = "Q"
filter = { REF_AREA = "IT", INSTITUTIONAL_SECTOR = "S14A" }
sheets_by = "ADJUSTMENT"
negate = ["*_D_*"]
notes = "Conti economici trimestrali per settore istituzionale. Gli impieghi (codici *_D_*) hanno il segno meno solo nel file Excel."

[[dataset]]
id = "famiglie_destagionalizzati_trimestrali"
title = "Famiglie consumatrici: aggregati destagionalizzati (trimestrale)"
dataflow = "162_1064_DF_DCCN_ISTITUZ_QNA1_3"
frequency = "Q"
filter = { REF_AREA = "IT", INSTITUTIONAL_SECTOR = "S14A" }
negate = ["*_D_*"]
notes = "La sequenza dei conti trimestrale ISTAT è solo grezza: le serie destagionalizzate sono in questo dataflow separato."

[[dataset]]
id = "famiglie_indicatori_trimestrali"
title = "Famiglie consumatrici: propensione al risparmio, potere d'acquisto e altri indicatori (trimestrale)"
dataflow = "162_1064_DF_DCCN_ISTITUZ_QNA1_2"
frequency = "Q"
filter = { REF_AREA = "IT", INSTITUTIONAL_SECTOR = "S14A" }
sheets_by = "ADJUSTMENT"

[[dataset]]
id = "consumi_famiglie_trimestrali"
title = "Spesa per consumi finali delle famiglie (trimestrale)"
dataflow = "163_1226_DF_DCCN_QNA1_3"
frequency = "Q"
sheets_by = "ADJUSTMENT"

[[dataset]]
id = "consumi_coicop_trimestrali"
title = "Spesa delle famiglie per voce di spesa (COICOP 2 cifre) e durata (trimestrale)"
dataflow = "163_1226_DF_DCCN_QNA1_4"
frequency = "Q"
sheets_by = "ADJUSTMENT"

[[dataset]]
id = "popolazione_trimestrale"
title = "Popolazione media del periodo (trimestrale)"
dataflow = "163_88_DF_DCCN_OCCQSEC2010_2"
frequency = "Q"

# ---------------------------------------------------------------------------
# Annuali
# ---------------------------------------------------------------------------

[[dataset]]
id = "famiglie_conto_annuale"
title = "Famiglie consumatrici: sequenza dei conti (annuale)"
