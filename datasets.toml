# Datasets published by istatsync. See README, "Aggiungere un dataset".
#
# Dimensions left out of `filter` are downloaded in full. Use
# `istatsync describe <dataflow> --codes <DIM>` to see the available codes.

[defaults]
filter = { REF_AREA = "IT" }

# ---------------------------------------------------------------------------
# Trimestrali
# ---------------------------------------------------------------------------

[[dataset]]
id = "famiglie_conto_trimestrale"
title = "Famiglie consumatrici: sequenza dei conti (trimestrale)"
dataflow = "162_1064_DF_DCCN_ISTITUZ_QNA1_1"
frequency = "Q"
filter = { REF_AREA = "IT", INSTITUTIONAL_SECTOR = "S14A" }
sheets_by = "ADJUSTMENT"
negate = ["*_D_*"]
notes = "Conti economici trimestrali per settore istituzionale. Gli impieghi (codici *_D_*) hanno il segno meno solo nel file Excel."

[[dataset]]
id = "famiglie_destagionalizzati_trimestrali"
title = "Famiglie consumatrici: aggregati destagionalizzati (trimestrale)"
dataflow = "162_1064_DF_DCCN_ISTITUZ_QNA1_3"
frequency = "Q"
filter = { REF_AREA = "IT", INSTITUTIONAL_SECTOR = "S14A" }
negate = ["*_D_*"]
notes = "La sequenza dei conti trimestrale ISTAT è solo grezza: le serie destagionalizzate sono in questo dataflow separato."

[[dataset]]
id = "famiglie_indicatori_trimestrali"
title = "Famiglie consumatrici: propensione al risparmio, potere d'acquisto e altri indicatori (trimestrale)"
dataflow = "162_1064_DF_DCCN_ISTITUZ_QNA1_2"
frequency = "Q"
filter = { REF_AREA = "IT", INSTITUTIONAL_SECTOR = "S14A" }
sheets_by = "ADJUSTMENT"

[[dataset]]
id = "consumi_famiglie_trimestrali"
title = "Spesa per consumi finali delle famiglie (trimestrale)"
dataflow = "163_1226_DF_DCCN_QNA1_3"
frequency = "Q"
sheets_by = "ADJUSTMENT"

[[dataset]]
id = "consumi_coicop_trimestrali"
title = "Spesa delle famiglie per voce di spesa (COICOP 2 cifre) e durata (trimestrale)"
dataflow = "163_1226_DF_DCCN_QNA1_4"
frequency = "Q"
sheets_by = "ADJUSTMENT"

[[dataset]]
id = "popolazione_trimestrale"
title = "Popolazione media del periodo (trimestrale)"
dataflow = "163_88_DF_DCCN_OCCQSEC2010_2"
frequency = "Q"

[[dataset]]
id = "ula_trimestrali"
title = "Unità di lavoro, occupati e ore lavorate per branca, dipendenti e totale (trimestrale)"
dataflow = "163_88_DF_DCCN_OCCQSEC2010_1"
frequency = "Q"
filter = { REF_AREA = "IT", DATA_TYPE_AGGR = ["FT", "PS", "HW"], EMPLOYMENT_STATUS = ["1", "2", "9"], TYPE_EMPLOYMENT = "TOT" }
sheets_by = "ADJUSTMENT"
notes = "FT = unità di lavoro (ULA), PS = occupati, HW = ore lavorate, in migliaia. EMPLOYMENT_STATUS 1 = dipendenti, 2 = indipendenti, 9 = totale. Attenzione: per il reddito da lavoro dipendente per ULA servono le ULA (FT), non gli occupati (PS)."

[[dataset]]
id = "redditi_lavoro_trimestrali"
title = "Redditi da lavoro dipendente, retribuzioni lorde e contributi per branca (trimestrale)"
dataflow = "163_1226_DF_DCCN_QNA1_5"
frequency = "Q"
sheets_by = "ADJUSTMENT"

[[dataset]]
id = "ipab_trimestrale"
title = "Prezzi delle abitazioni (IPAB), base 2025 (trimestrale, dal 2010)"
dataflow = "143_497_DF_DCSP_IPAB_6"
frequency = "Q"
sheets_by = "MEASURE"
notes = "Il dato dell'ultimo trimestre è provvisorio. Serve per stimare la ricchezza immobiliare degli anni non ancora pubblicati."

[[dataset]]
id = "ricchezza_finanziaria_trimestrale"
title = "Famiglie e ISP: attività e passività finanziarie, consistenze e transazioni (Banca d'Italia, trimestrale)"
source = "ecb"
dataflow = "QSA"
frequency = "Q"
filter = { ADJUSTMENT = "N", REF_AREA = "IT", COUNTERPART_AREA = "W0", REF_SECTOR = "S1M", COUNTERPART_SECTOR = "S1", CONSOLIDATION = "N", ACCOUNTING_ENTRY = ["A", "L"], STO = ["LE", "F"], MATURITY = "_Z", EXPENDITURE = "_Z", UNIT_MEASURE = "XDC", CURRENCY_DENOM = "_T", VALUATION = "S", PRICES = "V", TRANSFORMATION = "N", CUST_BREAKDOWN = "_T" }
sheets_by = "STO"
notes = "Conti finanziari della Banca d'Italia (tavola TFAT0012), letti dal dataset QSA della BCE a cui la Banca li trasmette: stessi valori, ma con un'API pubblica. Settore S1M = famiglie e istituzioni senza scopo di lucro (perimetro diverso da S14A del reddito). LE = consistenze, F = transazioni; A = attività, L = passività; INSTR_ASSET F = totale. Ricchezza finanziaria netta = attività - passività (LE, F)."

