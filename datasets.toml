frequency = "A"
filter = { REF_AREA = "IT", DATA_TYPE_AGGR = ["FT", "PS", "HW"], EMPLOYMENT_STATUS = ["1", "2", "9"], TYPE_EMPLOYMENT = "TOT" }

[[dataset]]
id = "ipab_annuale"
title = "Prezzi delle abitazioni (IPAB), base 2025, medie annue (dal 2010)"
dataflow = "143_497_DF_DCSP_IPAB_7"
frequency = "A"
sheets_by = "MEASURE"

[[dataset]]
id = "famiglie_conto_annuale"
title = "Famiglie consumatrici: sequenza dei conti (annuale)"
dataflow = "94_1063_DF_DCCN_ISTITUZ_ANA1_1"
frequency = "A"
filter = { REF_AREA = "IT", INSTITUTIONAL_SECTOR = "S14A" }
negate = ["*_D_*"]
notes = "Conti economici annuali per settore istituzionale. Gli impieghi (codici *_D_*) hanno il segno meno solo nel file Excel."

[[dataset]]
id = "famiglie_indicatori_annuali"
title = "Famiglie consumatrici: propensione al risparmio, potere d'acquisto e altri indicatori (annuale)"
dataflow = "94_1063_DF_DCCN_ISTITUZ_ANA1_2"
frequency = "A"
filter = { REF_AREA = "IT", INSTITUTIONAL_SECTOR = "S14A" }

[[dataset]]
id = "consumi_coicop_annuali"
title = "Spesa delle famiglie per voce di spesa (COICOP 3 cifre) e durata (annuale)"
dataflow = "92_1225_DF_DCCN_ANA1_6"
frequency = "A"

[[dataset]]
id = "valori_pro_capite_annuali"
title = "PIL, reddito e consumi per abitante (annuale)"
dataflow = "92_1225_DF_DCCN_ANA1_7"
frequency = "A"

[[dataset]]
